<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MY HD</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--lime:#fccb10}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#000;color:#fff;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{min-height:100vh;max-width:480px;margin:auto;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.logo{display:block;width:156px;height:156px;border-radius:34px;margin:0 auto 20px}
.pick,button{display:block;width:100%;border-radius:16px;padding:18px 16px;font-size:18px;font-weight:800;font-family:inherit;text-align:center;cursor:pointer}
.pick{border:2px solid var(--lime);color:var(--lime);background:transparent}
.pick:active{background:rgba(252,203,16,.14)}
button{border:0;background:var(--lime);color:#000}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{background:#1a1a1a;color:#666;cursor:default}
input{display:none}
#fileinfo{text-align:center;font-size:14px;color:#9aa39a;overflow-wrap:anywhere}
#status{margin:8px 0 0;min-height:64px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:#cfd6c6}
.turbo{display:none;margin:6px 0 0}
.turbo.on{display:block}
.track{position:relative;height:16px;border-radius:99px;background:#0b1624;border:1px solid #12335a;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#0057ff,#00b7ff 60%,#8ff3ff);box-shadow:0 0 14px #00b7ff,0 0 30px rgba(0,183,255,.55);position:relative;overflow:hidden;transition:width .12s linear}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.35) 14px 22px);background-size:44px 100%;animation:run .45s linear infinite}
@keyframes run{to{background-position:44px 0}}
.turbo.done .fill::after{animation:none;background:none}
.pct{margin-top:6px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.14em;color:#00b7ff;text-shadow:0 0 10px rgba(0,183,255,.7)}
.good{color:var(--lime)!important}.bad{color:#ff8a80!important}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
let selected=null;
$('file').addEventListener('change',()=>{
 selected=$('file').files[0]||null;
 $('fileinfo').textContent=selected?`${selected.name} · ${(selected.size/1048576).toFixed(2)} MiB`:'Ningún archivo seleccionado.';
 $('go').disabled=!selected;
 $('status').className=''; $('status').textContent='Listo para analizar el archivo. El original permanecerá intacto.';
});

const U8=Uint8Array;
const cat=a=>{let n=0;for(const x of a)n+=x.length;const o=new U8(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const mk=(t,pl)=>{const o=new U8(8+pl.length),v=new DataView(o.buffer);v.setUint32(0,o.length);for(let i=0;i<4;i++)o[4+i]=t.charCodeAt(i);o.set(pl,8);return o};
const be=(n,sz,vals,big)=>{const o=new U8(vals.length*sz),v=new DataView(o.buffer);vals.forEach((x,i)=>big?v.setBigUint64(i*8,BigInt(x)):v.setUint32(i*4,x));return o};
const hdr=n=>be(0,4,[0,n]);
const T_stsz=a=>mk('stsz',cat([be(0,4,[0,0,a.length]),be(0,4,a)]));
const T_stsc=r=>mk('stsc',cat([hdr(r.length),be(0,4,r.flat())]));
const T_co64=a=>mk('co64',cat([hdr(a.length),be(0,8,a,1)]));
const T_stco=a=>mk('stco',cat([hdr(a.length),be(0,4,a)]));
const T_stts=r=>mk('stts',cat([hdr(r.length),be(0,4,r.flat())]));
function boxes(b,s,e){const o=[],v=new DataView(b.buffer,b.byteOffset,b.byteLength);let p=s;
 while(p+8<=e){let sz=v.getUint32(p),h=8;const t=String.fromCharCode(b[p+4],b[p+5],b[p+6],b[p+7]);
  if(sz===1){sz=Number(v.getBigUint64(p+8));h=16}else if(sz===0)sz=e-p;
  if(sz<h||p+sz>e)break;o.push({t,s:p,e:p+sz,h});p+=sz}return o}
const find=(b,x,t)=>boxes(b,x.s+x.h,x.e).find(y=>y.t===t);
function parseTrak(b,trak,lenient){
 const v=new DataView(b.buffer,b.byteOffset,b.byteLength),g=o=>v.getUint32(o);
 const tkhd=find(b,trak,'tkhd'),mdia=find(b,trak,'mdia'),mdhd=find(b,mdia,'mdhd'),hdlr=find(b,mdia,'hdlr'),minf=find(b,mdia,'minf'),stbl=find(b,minf,'stbl');
 if(!tkhd||!mdhd||!hdlr||!stbl)throw Error('Pista incompleta.');
 const id=g(tkhd.s+12+(b[tkhd.s+8]?16:8)),ts=g(mdhd.s+12+(b[mdhd.s+8]?16:8));
 const kind=String.fromCharCode(...b.subarray(hdlr.s+16,hdlr.s+20));
 const ch={};for(const c of boxes(b,stbl.s+stbl.h,stbl.e))if(!ch[c.t])ch[c.t]=c;
 for(const k of['stsz','stsc','stts'])if(!ch[k])throw Error('Falta '+k);
 if(!ch.stco&&!ch.co64)throw Error('Falta stco/co64');
 const z=ch.stsz,fixed=g(z.s+12);let n=g(z.s+16);const sz=new Array(n);
 for(let i=0;i<n;i++)sz[i]=fixed||g(z.s+20+i*4);
 const sc=ch.stsc,ns=g(sc.s+12),rows=[];for(let i=0;i<ns;i++)rows.push([g(sc.s+16+i*12),g(sc.s+20+i*12),g(sc.s+24+i*12)]);
 const co=ch.co64||ch.stco,is64=!!ch.co64,nc=g(co.s+12),offs=[];
 for(let i=0;i<nc;i++)offs.push(is64?Number(v.getBigUint64(co.s+16+i*8)):g(co.s+16+i*4));
 const so=[];let s=0;
 for(let c=0;c<nc;c++){let per=0;for(const r of rows){if(r[0]<=c+1)per=r[1];else break}let o=offs[c];for(let k=0;k<per&&s<n;k++){so.push(o);o+=sz[s++]}}
 if(s!==n)throw Error('stsc/stsz no concuerdan en una pista.');
 const st=ch.stts,nt=g(st.s+12),stts=[],dts=[];let t0=0;
 for(let i=0;i<nt;i++){const c=g(st.s+16+i*8),d=g(st.s+20+i*8);stts.push([c,d]);for(let k=0;k<c;k++){dts.push(t0/ts);t0+=d}}
 let trunc=0;if(dts.length<n){if(lenient){while(dts.length<n)dts.push(dts[dts.length-1]||0)}else{trunc=n-dts.length;n=dts.length;sz.length=n;so.length=n}}
 return{trak,tkhd,mdia,minf,stbl,id,ts,kind,n,sz,so,dts,rows,stts,nc,trunc};
}
function rebuildTrak(b,T,repl,newId){
 const rb=(box,fn)=>mk(box.t,cat(boxes(b,box.s+box.h,box.e).map(c=>fn(c)||b.subarray(c.s,c.e))));
 const stbl=rb(T.stbl,c=>(c.t==='stco'||c.t==='co64')?repl.chunk:repl[c.t]);
 const minf=rb(T.minf,c=>c.t==='stbl'?stbl:null);
 const mdia=rb(T.mdia,c=>c.t==='minf'?minf:null);
 return rb(T.trak,c=>{if(c.t==='mdia')return mdia;
  if(c.t==='tkhd'&&newId){const t=b.slice(c.s,c.e);new DataView(t.buffer).setUint32(12+(t[8]?16:8),newId);return t}return null});
}
const zeroLast=r=>{r=r.map(x=>x.slice());const l=r[r.length-1];if(l[0]>4){l[0]--;r.push([1,0])}else l[1]=0;return r};
const same=(a,b)=>{if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true};

async function process(file,o,log){
 log('Leyendo archivo…');
 const b=new U8(await file.arrayBuffer()),top=boxes(b,0,b.length);
 const ftyp=top.find(x=>x.t==='ftyp'),moov=top.find(x=>x.t==='moov'),mds=top.filter(x=>x.t==='mdat');
 if(!ftyp||!moov||mds.length!==1)throw Error('Se necesita un MP4 con ftyp, moov y un solo mdat.');
 const md=mds[0],dS=md.s+md.h,dE=md.e;
 const trs=boxes(b,moov.s+moov.h,moov.e).filter(x=>x.t==='trak').map(x=>parseTrak(b,x));
 const vi=trs.findIndex(t=>t.kind==='vide');if(vi<0)throw Error('No hay pista de video.');
 if(trs.some(t=>t.sz.length===0))throw Error('Hay una pista sin muestras.');
 for(const t of trs)for(let i=0;i<t.n;i++)if(t.so[i]<dS||t.so[i]+t.sz[i]>dE)throw Error('Una muestra queda fuera de mdat.');
 const V=trs[vi];let secs=o.chunk;if(secs===0&&trs.some(t=>t.trunc))secs=1;let parts=[],pos=0;
 const plan=trs.map(()=>({offs:[],counts:[]}));
 if(secs>0){
  log('Reordenando chunks…');
  trs.forEach(t=>t.i=0);
  const maxG=Math.floor(Math.max(...trs.map(t=>t.dts[t.n-1]))/secs);
  for(let g=0;g<=maxG+1;g++)trs.forEach((t,k)=>{let n=0;const first=pos;
   while(t.i<t.n&&Math.floor(t.dts[t.i]/secs)<=g){parts.push(b.subarray(t.so[t.i],t.so[t.i]+t.sz[t.i]));pos+=t.sz[t.i];t.i++;n++}
   if(n){plan[k].offs.push(first);plan[k].counts.push(n)}});
  if(trs.some(t=>t.i!==t.n))throw Error('No se pudieron ubicar todas las muestras.');
 }else{
  parts=[b.subarray(dS,dE)];pos=dE-dS;
  trs.forEach((t,k)=>{plan[k].offs=t.so.length?null:[]});
 }
 const rowsOf=c=>{const r=[];let prev=-1;c.forEach((n,i)=>{if(n!==prev){r.push([i+1,n,1]);prev=n}});return r};
 const big=file.size>2**31;
 const PAD=o.pad,PSZ=o.padsz;
 const maxId=Math.max(...trs.map(t=>t.id));
 const mvhd=find(b,moov,'mvhd');
 const build=(base,end)=>{
  const out=[];let dup=null;const lastT=boxes(b,moov.s+moov.h,moov.e).filter(x=>x.t==='trak').pop();
  let k=0;
  for(const c of boxes(b,moov.s+moov.h,moov.e)){
   if(c.t==='mvhd'){const m=b.slice(c.s,c.e);new DataView(m.buffer).setUint32(m.length-4,maxId+2);out.push(m)}
   else if(c.t==='trak'){
    const t=trs[k],p=plan[k];k++;
    const isV=t===V;let co,rows;
    if(secs>0){co=p.offs.map(x=>base+x);rows=rowsOf(p.counts)}
    else{co=t.so.length?null:[];}
    if(secs===0){ // chunks originales: reubicar offsets de chunk
     const old=[];{const v=new DataView(b.buffer,b.byteOffset,b.byteLength),e=find(b,t.stbl,'co64')||find(b,t.stbl,'stco');
      const n=v.getUint32(e.s+12);for(let i=0;i<n;i++)old.push(e.t==='co64'?Number(v.getBigUint64(e.s+16+i*8)):v.getUint32(e.s+16+i*4))}
     co=old.map(x=>x-dS+base);rows=t.rows}
    const stts=isV&&o.zero?T_stts(zeroLast(t.stts)):undefined;
    const repl={stsc:T_stsc(rows),chunk:(isV||big)?T_co64(co):T_stco(co)};if(stts)repl.stts=stts;if(t.trunc)repl.stsz=T_stsz(t.sz);
    out.push(rebuildTrak(b,t,repl));
    if(isV){const pads=new Array(PAD).fill(end-PSZ);
     dup=rebuildTrak(b,t,{...repl,stsz:T_stsz(t.sz.concat(new Array(PAD).fill(PSZ))),stsc:T_stsc(rows.concat([[co.length+1,1,1]])),chunk:T_co64(co.concat(pads))},maxId+1)}
    if(c.s===lastT.s&&dup)out.push(dup);
   }else out.push(b.subarray(c.s,c.e));
  }
  return mk('moov',cat(out));
 };
 log('Construyendo tablas…');
 const m0=build(65536,1<<20),head=b.slice(ftyp.s,ftyp.e),free=mk('free',new U8(0));
 const base=head.length+m0.length+free.length+8,total=pos;
 if(8+total>=2**32)throw Error('El archivo es demasiado grande para este método.');
 const mm=build(base,base+total);if(mm.length!==m0.length)throw Error('Error interno de tamaño.');
 const mh=new U8(8);new DataView(mh.buffer).setUint32(0,8+total);mh.set([109,100,97,116],4);
 const outB=new Blob([head,mm,free,mh,...parts],{type:'video/mp4'});
 // verificación
 log('Verificando…');
 const hb=new U8(await outB.slice(0,base).arrayBuffer()),tp=boxes(hb,0,hb.length),mo=tp.find(x=>x.t==='moov');
 const nt=boxes(hb,mo.s+mo.h,mo.e).filter(x=>x.t==='trak').map(x=>parseTrak(hb,x,true));
 if(nt.length!==trs.length+1)throw Error('Verificación: cantidad de pistas inesperada.');
 const rep=[];let ok=true;
 for(let k=0;k<trs.length;k++){const A=trs[k],B=nt[k];
  if(A.n!==B.n){ok=false;rep.push('pista '+A.id+': distinto número de muestras');continue}
  const idx=new Set([0,A.n-1]);for(let j=0;j<25;j++)idx.add(Math.floor(Math.random()*A.n));
  for(const i of idx){const x=b.subarray(A.so[i],A.so[i]+A.sz[i]),y=new U8(await outB.slice(B.so[i],B.so[i]+B.sz[i]).arrayBuffer());
   if(!same(x,y)){ok=false;rep.push('pista '+A.id+': muestra '+i+' distinta');break}}
  const tot=A.sz.reduce((p,q)=>p+q,0);if(k===0&&false)0;
 }
 const D=nt[nt.length-1];
 if(D.n!==V.n+PAD){ok=false;rep.push('pista duplicada con conteo inesperado')}
 if(!ok)throw Error('Falló la verificación:\n'+rep.join('\n'));
 return{blob:outB,summary:`Pistas reales: ${trs.length} (muestras de video: ${V.n})\nPista duplicada: +${PAD} entradas de ${PSZ} bytes\nmoov al inicio · chunks: ${secs>0?secs+' s':'originales'}${trs.some(t=>t.trunc)?'\nRelleno previo descartado: '+trs.reduce((p,t)=>p+t.trunc,0)+' entradas (el video ya traía relleno)':''}\nMuestras comprobadas byte por byte (primera, última y 25 al azar por pista): OK\nTamaño: ${(outB.size/1048576).toFixed(2)} MiB`};
}


let lastUrl=null;
let barNow=0,barTarget=0,barTimer=null;
const STAGES=[['Leyendo',18],['Reordenando',50],['Construyendo',82],['Verificando',94]];
function barPaint(){const v=Math.min(100,barNow);$('fill').style.width=v+'%';$('pct').textContent=Math.floor(v)+'%'}
function barStart(){clearInterval(barTimer);barNow=0;barTarget=8;$('turbo').className='turbo on';barPaint();
 barTimer=setInterval(()=>{if(barNow<barTarget)barNow+=Math.max(.4,(barTarget-barNow)*.09);else if(barTarget<97)barNow+=.04;barPaint()},40)}
function barStage(m){for(const[k,t]of STAGES)if(m.startsWith(k)){barTarget=Math.max(barTarget,t)}}
async function barFinish(){barTarget=100;while(barNow<99.5){await new Promise(r=>setTimeout(r,40))}barNow=100;barPaint();clearInterval(barTimer);$('turbo').className='turbo on done'}
function barHide(){clearInterval(barTimer);$('turbo').className='turbo'}
const IS_NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
async function nativeShare(blob,name){
 const {Filesystem,Share}=Capacitor.Plugins,CH=3*1024*1024;
 const b64=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.onerror=()=>no(f.error);f.readAsDataURL(b)});
 try{await Filesystem.deleteFile({path:name,directory:'CACHE'})}catch(e){}
 for(let i=0;i<blob.size;i+=CH){
  const data=await b64(blob.slice(i,i+CH));
  if(i===0)await Filesystem.writeFile({path:name,data,directory:'CACHE'});
  else await Filesystem.appendFile({path:name,data,directory:'CACHE'});
  $('status').textContent='Preparando archivo… '+Math.min(100,Math.floor((i+CH)/blob.size*100))+'%';
 }
 const {uri}=await Filesystem.getUri({path:name,directory:'CACHE'});
 try{await Share.share({title:name,url:uri,dialogTitle:'Guardar o compartir video'})}
 catch(e){if(!/cancel/i.test(String(e&&e.message||e)))throw e}
}
const OPTS={chunk:1,pad:26688,padsz:8,zero:true};
$('go').addEventListener('click',async()=>{
 if(!selected)return;
 $('go').disabled=true;$('again').style.display='none';$('status').className='';$('status').textContent='Analizando y preparando la copia… Mantén la pestaña abierta.';barStart();
 try{
  const r=await process(selected,OPTS,m=>{barStage(m);$('status').textContent=m+'\nMantén la pestaña abierta.'});
  await barFinish();
  if(lastUrl)URL.revokeObjectURL(lastUrl);
  const url=lastUrl=URL.createObjectURL(r.blob),name=selected.name.replace(/\.(mp4|mov)$/i,'')+'_MY_method.mp4';
  if(IS_NATIVE){
   await nativeShare(r.blob,name);
   $('again').removeAttribute('href');$('again').onclick=()=>{nativeShare(r.blob,name).catch(()=>{});return false};$('again').style.display='block';
  }else{
   const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
   $('again').href=url;$('again').download=name;$('again').style.display='block';
  }
  $('status').className='good';$('status').textContent=r.summary+'\nNo se codificó ni comprimió audio/video.\n\n'+(IS_NATIVE?'Listo: elige dónde guardarlo en el menú que se abrió.':'Listo: el video quedó en Descargas y debería verse en tu galería.')+'';
 }catch(e){barHide();$('status').className='bad';$('status').textContent='No se generó ningún archivo.\n'+(e&&e.message?e.message:String(e));}
 finally{$('go').disabled=false;}
});

if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
